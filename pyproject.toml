[project]
name = "pm-knowledge-worker"
version = "0.1.0"
description = "Evidence-first product knowledge API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.121,<1",
    "pydantic-settings>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/pmknowledge"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src"]
