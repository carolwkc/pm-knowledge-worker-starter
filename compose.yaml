services:
  db:
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: pmknowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pmknowledge
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmknowledge -d pmknowledge"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pmknowledge@db:5432/pmknowledge
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/start-api.sh"]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
